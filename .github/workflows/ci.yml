name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pipeline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run identification-critical tests
        run: pytest -q

      - name: Smoke-test the worked-example pipeline end to end
        run: |
          python scripts/00_generate_dummy_data.py
          python scripts/01_prepare_data.py
          python scripts/02_estimate.py

      - name: Check expected artifacts were produced
        run: |
          test -f data/raw/manager_data.csv
          test -f data/processed/analysis.parquet
          test -f results/summary.json
          test -f reports/tables/estimates.csv
          test -f reports/figures/overlap.png
          echo "All pipeline artifacts present."
